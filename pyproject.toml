# Project metadata and tool configuration for the runtime.
#
# This is NOT an installable package: `packages = []` below, and CI never runs
# `pip install .`. The file exists so that (a) the test dependencies have one
# declared home, (b) ruff and pytest have one shared configuration, and (c)
# GitHub / pip tooling can read the project's name, version and licence.
#
# Version bumps: change `version` here and add a CHANGELOG.md entry in the same
# commit.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-agentic-runtime"
version = "0.2.0"
description = "Hook-enforced guardrails, review gates and a role-scoped agent roster for Claude Code."
license = "MIT"
requires-python = ">=3.9"

[project.optional-dependencies]
# Exactly what the test suite imports or shells out to:
#   pytest, pytest-cov  - the runner and `hooks/run_tests.sh`'s optional coverage
#   jsonschema          - imported at module level by hooks/tests/test_cycle_telemetry.py
#   detect-secrets      - the binary scripts/codex_review.sh requires on PATH;
#                         pinned to the version that script documents and that
#                         scripts/ci_layout.sh installs, so the two never drift
test = [
    "pytest>=8",
    "pytest-cov",
    "jsonschema",
    "detect-secrets==1.5.0",
]
# The linter. Kept apart from `test` so a test-only environment stays small;
# scripts/ci_layout.sh installs both. Pinned EXACTLY, and to the same version
# in scripts/ci_layout.sh (PACKAGES) and .pre-commit-config.yaml (the
# ruff-pre-commit `rev`), because the format-exclude list below is the output
# of this one version's formatter: a different ruff reformats a different set
# of files. hooks/tests/test_packaging_pins.py fails when the three disagree.
lint = [
    "ruff==0.15.18",
]

[tool.setuptools]
# Not a package: the runtime is a directory of scripts, hooks and documents.
packages = []

[tool.ruff]
target-version = "py39"
line-length = 100
# Peer-contested paths are excluded until the session that holds them has
# landed its work; each is listed in CHANGELOG.md "Known gaps" and is removed
# from this list when its window opens. The non-Python contested files
# (scripts/codex_review.sh, docs/subsystems/codex-review.md) need no entry here.
extend-exclude = [
    # Staged by another live session; carries E741/F541/F841 today.
    "hooks/tests/test_repo_manifest.py",
    # Staged by another live session (codex review harness and its canary).
    "hooks/tests/test_codex_canary.py",
    "hooks/tests/test_codex_review.py",
    # Staged by another live session (repository manifest CLI).
    "scripts/repo_manifest.py",
    # Superseded shell guards and their shell tests, kept for reference; not
    # maintained and not exported. Holds no Python today; the entry keeps any
    # Python added there out of the lint until the directory is retired.
    "scripts/legacy/",
    # Skill bundles synced into this machine by the Claude Code client, and the
    # client's trash for removed ones. Untracked third-party code, never part
    # of the repository or the export; a local `ruff check .` would lint it.
    "skills/synced/",
    "skills/.trash/",
]

[tool.ruff.lint]
# Ruff's own default rule set, spelled out so a ruff upgrade cannot silently
# widen it: pycodestyle E4 (imports), E7 (statements), E9 (syntax/runtime
# errors) and pyflakes F. A wider set (I, B, UP, E501) is a measured follow-up.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Formatting is deferred (operator decision, 2026-10-12): the one-off
# `ruff format` pass over the whole tree lands as a single dedicated commit.
# Until then the files that pass would change are listed so that
# `ruff format --check` is green for everything else. The list is generated,
# never hand-edited, and only with the ruff version pinned in the `lint` extra
# above (`ruff --version` must say 0.15.18). To regenerate it, empty it
# (`exclude = []`) and run
#   out=$(git ls-files -z '*.py' | xargs -0 ruff format --check --force-exclude --no-cache 2>&1)
#   printf '%s\n' "$out" | sed -n 's/^Would reformat: //p' | sort | grep . \
#     || { echo "no 'Would reformat:' lines: list not emptied, ruff errored, or its output changed" >&2; false; }
# The `grep .` makes an empty result a failure instead of a silently empty
# list. Paste the sorted result back. Remove an entry as soon as its file is
# formatted. Files in [tool.ruff] extend-exclude are skipped by both tools and
# never need an entry here.
exclude = [
    "account_rotation/alerts.py",
    "account_rotation/browser.py",
    "account_rotation/burn.py",
    "account_rotation/cli_login.py",
