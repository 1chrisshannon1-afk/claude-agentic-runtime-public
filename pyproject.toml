[tool.pytest.ini_options]
# The runtime repo had NO pytest config at all, so the `live_machine` marker
# raised PytestUnknownMarkWarning on every run and would ERROR under
# --strict-markers (cold-review finding 8).
#
# `live_machine` marks SMOKE tests that deliberately opt out of the autouse
# hermetic fixture and read this machine's real telemetry. That opt-out is
# intentional and narrow: the defect class they exist to catch -- a panel that
# dies only when data IS available -- is provably invisible to a hermetic
# fixture. They skip themselves when the real sources are absent (CI, another
# machine), so they never fail spuriously.
#
# They are SLOW (~4 min against the live store). Default runs exclude them:
#     python3 -m pytest hooks/tests/ -q -m "not live_machine"
# Run them explicitly before landing anything that touches the renderer:
#     python3 -m pytest hooks/tests/ -q -m live_machine
markers = [
    "live_machine: reads this machine's real telemetry; opts out of the hermetic fixture; slow",
]
